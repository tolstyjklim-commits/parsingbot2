name: Telegram NFT Bot

on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:

concurrency:
  group: telegram-bot
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install chromium

      - name: Run bot (5h 40m)
        id: bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PARSER_PROXIES: ${{ secrets.PARSER_PROXIES }}
          ADMIN_IDS: ${{ secrets.ADMIN_IDS }}
          PYTHONUNBUFFERED: "1"
        run: |
          set +e
          timeout --signal=INT --kill-after=60 20400 python main.py
          code=$?
          echo "exit code: $code"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Start next cycle
        if: steps.bot.outputs.code == '124'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run bot.yml --repo "${{ github.repository }}" --ref "${{ github.ref_name }}"

      - name: Fail job if bot crashed
        if: steps.bot.outputs.code != '124' && steps.bot.outputs.code != '0'
        run: |
          echo "Бот завершился с кодом ${{ steps.bot.outputs.code }}"
          exit 1
